# Gemini design lane: when an issue has both `type:design` and `agent:gemini`, Gemini looks at
# screenshots of main (phone + desktop, light + dark) and posts a design proposal on the issue.
# Claude then implements it in a PR. Read-only on the repo; writes one issue comment.
name: Gemini design
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number with the design request
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: gemini-design-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true
jobs:
  propose:
    name: Gemini design proposal
    if: >-
      vars.AGENTS_ENABLED != 'false' && (github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["type:design","agent:gemini"]'), github.event.label.name) &&
      contains(github.event.issue.labels.*.name, 'type:design') && contains(github.event.issue.labels.*.name, 'agent:gemini')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Screenshots of the home page
        run: |
          npm run preview > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:4321/ > /dev/null && break; sleep 2; done
          node scripts/design/screenshots.mjs
      - name: Ask Gemini for a design proposal
        run: node scripts/design/gemini-design.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with: { name: design-shots, path: shots/, retention-days: 7 }
