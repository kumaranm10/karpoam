# Quality gates for every PR and every push to main (milestone M1).
# Required checks on main: all five job names below.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Known vulnerabilities in dependencies (high or critical fail)
        run: npm audit --audit-level=high
      - name: Workflow files are valid
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.11 -color
      - name: No secrets in the code
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total;const r=k=>s[k].pct+'%';console.log('| Lines | Statements | Functions | Branches |\n|---|---|---|---|\n| '+[r('lines'),r('statements'),r('functions'),r('branches')].join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY" || true

  build:
    name: Lesson rules + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run budget
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: dist, path: dist, retention-days: 3 }

  e2e:
    name: Browser + accessibility tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: dist, path: dist }
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse speed check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version-file: .nvmrc }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: dist, path: dist }
      # Best of 3 runs per page (shared CI machines are noisy on the first, cold run).
      - run: npx --yes @lhci/cli@0.16.1 autorun
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with: { name: lighthouse, path: .lighthouseci, retention-days: 7, include-hidden-files: true }
