# Weekly dependency updates. Dependabot PRs auto-merge when all checks pass (agent gate allows bots without agent review).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '04:00', timezone: Asia/Singapore }
    open-pull-requests-limit: 3
    cooldown: { default-days: 14 }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '04:00', timezone: Asia/Singapore }
    open-pull-requests-limit: 2
    cooldown: { default-days: 14 }
